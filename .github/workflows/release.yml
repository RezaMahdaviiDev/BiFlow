name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

# Tag v* publishes Linux .deb + AppImage and Windows portable .exe + NSIS.
# Third-party VPN apps stay in-app (ADR 0004); this workflow does not vendor them.
# Build jobs only upload workflow artifacts. The final job publishes all four together.
# Native runners follow the official Tauri GitHub pipeline: Linux WebKitGTK 4.1 on
# Ubuntu 24.04, Windows MSVC + WebView2 on windows-2025. Do not cross-compile the
# Windows installer from Linux here; the Linux Tauri CLI rejects --bundles nsis.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Verify tag matches the version file
        shell: bash
        run: |
          expected="v$(tr -d '[:space:]' < version)"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version file ${expected}"
            exit 1
          fi
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: --bundles deb,appimage
          - platform: windows-2025
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - name: Disable CRLF conversion on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2t64
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (Test-Path $nsis) {
            Add-Content -Path $env:GITHUB_PATH -Value $nsis
          }
          Get-Command makensis -ErrorAction Stop
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
      - name: Stage portable Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          exe="target/release/iran-split-desktop.exe"
          test -f "${exe}"
          cp "${exe}" BiFlow.exe
      - name: Upload Linux release artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows release artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            BiFlow.exe
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate and validate latest.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-latest-json.mjs \
            --assets release-assets \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --output release-assets/latest.json \
            --notes "BiFlow ${GITHUB_REF_NAME#v}"
      - name: Validate and publish the complete release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t debs < <(find release-assets -type f -name '*.deb' -print | sort)
          mapfile -t appimages < <(find release-assets -type f -name '*.AppImage' -print | sort)
          mapfile -t appimage_sigs < <(find release-assets -type f -name '*.AppImage.sig' -print | sort)
          mapfile -t portable < <(find release-assets -type f -name 'BiFlow.exe' -print | sort)
          mapfile -t installers < <(find release-assets -type f -name '*-setup.exe' -print | sort)
          mapfile -t installer_sigs < <(find release-assets -type f -name '*-setup.exe.sig' -print | sort)
          mapfile -t manifests < <(find release-assets -type f -name 'latest.json' -print | sort)

          if (( ${#debs[@]} != 1 || ${#appimages[@]} != 1 || ${#appimage_sigs[@]} != 1 || ${#portable[@]} != 1 || ${#installers[@]} != 1 || ${#installer_sigs[@]} != 1 || ${#manifests[@]} != 1 )); then
            echo "Expected one deb, AppImage, AppImage signature, portable exe, NSIS installer, NSIS signature, and latest.json"
            find release-assets -type f -print
            exit 1
          fi

          assets=("${debs[@]}" "${appimages[@]}" "${appimage_sigs[@]}" "${portable[@]}" "${installers[@]}" "${installer_sigs[@]}" "${manifests[@]}")
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --generate-notes \
              --title "BiFlow ${GITHUB_REF_NAME}" \
              --verify-tag
          fi
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          gh release edit "${GITHUB_REF_NAME}" \
            --draft=false \
            --prerelease=false \
            --title "BiFlow ${GITHUB_REF_NAME}"
