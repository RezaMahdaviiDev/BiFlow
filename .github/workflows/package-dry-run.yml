name: Package dry-run

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (all, linux, windows)
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Non-publishing native packaging smoke test. Uploads workflow artifacts only;
# never creates or updates a GitHub Release.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: --bundles deb,appimage
            artifact: release-linux
            upload_linux: true
            upload_windows: false
          - platform: windows-2025
            args: --bundles nsis
            artifact: release-windows
            upload_linux: false
            upload_windows: true
    runs-on: ${{ matrix.platform }}
    if: >-
      github.event.inputs.platform == 'all' ||
      (github.event.inputs.platform == 'linux' && matrix.upload_linux) ||
      (github.event.inputs.platform == 'windows' && matrix.upload_windows)
    timeout-minutes: 90
    steps:
      - name: Disable CRLF conversion on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2t64
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (Test-Path $nsis) {
            Add-Content -Path $env:GITHUB_PATH -Value $nsis
          }
          Get-Command makensis -ErrorAction Stop
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
      - name: Stage portable Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          exe="target/release/iran-split-desktop.exe"
          test -f "${exe}"
          cp "${exe}" BiFlow.exe
      - name: Upload Linux dry-run artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 3
      - name: Upload Windows dry-run artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-windows
          path: |
            BiFlow.exe
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 3
